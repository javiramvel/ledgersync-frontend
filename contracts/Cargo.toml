[workspace]
resolver = "2"
members = [
    "delta_reconciliation",
    "wall_street_asset",
    "yield_matrix",
    "institutional_compliance",
    "solvency_proof",
    "pricing_oracle"
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true