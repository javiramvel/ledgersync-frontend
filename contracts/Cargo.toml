[workspace]
resolver = "2"
members = [
    "wall_street_asset",
    "delta_reconciliation",
    "yield_matrix",
    "institutional_compliance",
    "solvency_proof",
    "pricing_oracle",
]

[workspace.dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
